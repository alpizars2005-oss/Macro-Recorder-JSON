name: Build Windows installer

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "macro_app/**"
      - "macro_recorder.py"
      - "requirements*.txt"
      - "build/windows/**"
      - "installer/**"
      - ".github/workflows/windows-installer.yml"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install runtime and packaging dependencies
        run: >-
          python -m pip install
          --disable-pip-version-check
          -r requirements.txt
          -r requirements-build.txt

      - name: Verify dependencies
        run: python -m pip check

      - name: Compile source
        run: python -m compileall -q macro_recorder.py macro_app tests

      - name: Run unit tests
        env:
          PYNPUT_BACKEND: dummy
        run: python -m unittest discover -s tests -v

      - name: Build standalone application
        run: pyinstaller --clean --noconfirm build/windows/MacroRecorderJSON.spec

      - name: Smoke-test packaged executable
        shell: pwsh
        run: |
          $process = Start-Process `
            -FilePath "dist\MacroRecorderJSON\MacroRecorderJSON.exe" `
            -ArgumentList "--version" `
            -Wait `
            -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Packaged executable failed with exit code $($process.ExitCode)."
          }

      - name: Install NSIS compiler
        run: choco install nsis --no-progress -y

      - name: Build one-click installer
        shell: pwsh
        run: |
          $compiler = (Get-Command makensis.exe -ErrorAction SilentlyContinue).Source
          if (-not $compiler) {
            $compiler = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          }
          if (-not (Test-Path $compiler)) {
            throw "NSIS compiler was not found."
          }
          Push-Location installer
          & $compiler "MacroRecorderJSON.nsi"
          $exitCode = $LASTEXITCODE
          Pop-Location
          if ($exitCode -ne 0) {
            throw "NSIS failed with exit code $exitCode."
          }

      - name: Create SHA-256 checksums
        shell: pwsh
        run: |
          $installer = Get-Item "dist\Macro-Recorder-JSON-Setup-*.exe"
          $portable = "dist\Macro-Recorder-JSON-Portable.zip"
          Compress-Archive -Path "dist\MacroRecorderJSON\*" -DestinationPath $portable -Force
          $files = @($installer.FullName, (Resolve-Path $portable).Path)
          $lines = foreach ($file in $files) {
            $hash = Get-FileHash -Algorithm SHA256 -Path $file
            "$($hash.Hash.ToLower())  $([IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content -Encoding ascii "dist\SHA256SUMS.txt"

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: Macro-Recorder-JSON-Windows
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/Macro-Recorder-JSON-Setup-*.exe
            dist/Macro-Recorder-JSON-Portable.zip
            dist/SHA256SUMS.txt

      - name: Publish tagged release files
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Macro-Recorder-JSON-Setup-*.exe
            dist/Macro-Recorder-JSON-Portable.zip
            dist/SHA256SUMS.txt
